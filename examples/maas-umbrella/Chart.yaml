apiVersion: v2
name: maas-umbrella
description: >-
  Example umbrella chart (not published) that demonstrates how to compose the published charts of this repository as
  subchart dependencies with values overlays.
type: application
version: 0.1.0
dependencies:
  - name: install-operators
    repository: oci://ghcr.io/jharmison-redhat/helm-charts
    version: ">=0.2.0 <0.3.0"
    alias: install-operators
    condition: install-operators.enabled
