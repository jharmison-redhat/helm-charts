# Pairs with the install-operators chart for install 1 of the two-install
# flow, before the operand umbrella (values.yaml) is installed — OLM makes
# the custom resources required by keycloak/postgres-cluster available only
# after the operators are installed:
#
#   helm upgrade --install install-operators charts/install-operators \
#       --values examples/maas-umbrella/operator-values.yaml
#   # wait for the operator deployments to be ready, then:
#   helm dependency build examples/maas-umbrella
#   helm upgrade --install maas-umbrella examples/maas-umbrella
operators:
  rhbk-operator:
    channel: stable-v26.2
    namespace: keycloak
    operatorGroup:
      enabled: true
      targetNamespaces:
        - keycloak

  cloudnative-pg:
    channel: stable-v1
    catalog: certified-operators

  rhcl-operator:
    channel: stable
    namespace: kuadrant-system
    ownSubscription: false
    installPlanApproval: Manual
    startingCSV: rhcl-operator.v1.4.3
    operatorGroup:
      enabled: true
    env:
      AUTH_SERVICE_TIMEOUT: 2s

  leader-worker-set:
    channel: stable-v1.0
    namespace: openshift-lws-operator
    operatorGroup:
      enabled: true
      targetNamespaces:
        - openshift-lws-operator

  nfd:
    channel: stable
    namespace: openshift-nfd
    namespaceLabels:
      openshift.io/cluster-monitoring: "true"
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
    operatorGroup:
      enabled: true
      targetNamespaces:
        - openshift-nfd

  gpu-operator-certified:
    channel: v26.3
    namespace: nvidia-gpu-operator
    catalog: certified-operators
    namespaceLabels:
      openshift.io/cluster-monitoring: "true"
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
    operatorGroup:
      enabled: true
      targetNamespaces:
        - nvidia-gpu-operator
