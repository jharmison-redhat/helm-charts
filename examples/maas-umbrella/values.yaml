# Values for the operand umbrella (install 2 of the two-install flow). The
# operator install (install 1) pairs with the install-operators chart — see
# operator-values.yaml.
#
# The OIDC values are set once here under global.oidc and propagate to both
# subcharts: keycloak-auth reads global.oidc.{realm,clientId,secret}
# directly, and keycloak's realm client entry references
# global.oidc.secret via a template string.
global:
  wildcardDomain: apps.cluster.example.com
  # openshift-ai derives its Gateway hostnames from global.cluster. These
  # independent consumer inputs must be kept consistent with wildcardDomain
  # above (the values below agree with it by default)
  cluster:
    name: cluster
    baseDomain: example.com
  oidc:
    realm: sso
    clientId: ocp-idp
    # Client secret shared by the keycloak realm client and keycloak-auth's
    # Secret; changing it here moves both at once
    secret: <client-secret>

keycloak:
  postgres:
    fullnameOverride: keycloak-postgres
    instances: 1
    storage:
      size: 2Gi
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 256Mi

openshift-ai:
  # Both transitive postgres Cluster instances would derive the same fullname
  # from the shared release name, so the two instances get DISTINCT
  # fullnameOverrides (keycloak.postgres.fullnameOverride: keycloak-postgres
  # above vs maas-postgres here)
  postgres:
    fullnameOverride: maas-postgres
  maasDb:
    create: true

  # Enabled tenant-config hook: a post-install,post-upgrade Job in the release
  # namespace waits for the product-created MaasTenantConfig/default-tenant
  # singleton, then merge-patches only the spec block below (privacy-conscious
  # captureUser false). Requires the rhods-operator MaaS components to reach
  # Managed; a fresh install may want a longer helm --timeout (10m) while the
  # operator reconciles. Prerequisite: label the routing namespaces explicitly
  # (kubectl label ns <ns> maas-gateway-access=true
  # openshift-ai-inference-access=true) — the Gateway selectors authorize
  # routing to labeled namespaces only
  maasTenantConfig:
    enabled: true
    spec:
      telemetry:
        metrics:
          captureUser: false

  realms:
    sso:
      admin:
        username: admin
        password: <admin-password>
      generated:
        prefix: user
        count: 5
        password: <user-password>
      groupsFromRoles: true
      clients:
        ocp-idp:
          secret: "{{ .Values.global.oidc.secret }}"
          redirectUris:
            - "*"
          defaultClientScopes:
            - acr
            - basic
            - email
            - groups
            - profile
            - roles
            - service_account
            - web-origins

keycloak-auth:
  clusterAdmins:
    users:
      - admin
  removeKubeAdmin: true
