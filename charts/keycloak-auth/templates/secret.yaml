{{- $secret := (.Values.openidClient | default dict).secret | default "" }}
{{- /* Gated on openidClient.secret being provided; see oauth.yaml */ -}}
{{- if ne $secret "" }}
apiVersion: v1
kind: Secret
metadata:
  name: openid-client-secret
  namespace: openshift-config
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
type: Opaque
data:
  clientSecret: {{ $secret | b64enc }}
{{- end }}
