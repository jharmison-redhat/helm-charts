{{- if .Values.removeKubeAdmin }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kubeadmin"]
    verbs: ["delete"]
{{- end }}
