{{- if .Values.removeKubeAdmin }}
apiVersion: batch/v1
kind: Job
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: remove-kubeadmin
      restartPolicy: Never
      containers:
      - name: remove-kubeadmin
        image: {{ .Values.global.toolsImage }}
        # No guard securityContext: kube-system is PSA-privileged and bypasses
        # SCC assignment, so no range UID is injected and the UID-less non-root
        # proof cannot pass there. This opt-in hook runs as the stock image's
        # default user in the platform-privileged namespace.
        imagePullPolicy: IfNotPresent
        command: ["oc"]
        args:
          - delete
          - secret
          - kubeadmin
          - --namespace
          - kube-system
          - --ignore-not-found
          # No wait keeps the Job's authority delete-only (waiting polls the
          # Secret with get/watch); success means the API accepted the
          # deletion request, not that a replacement login was verified.
          - --wait=false
{{- end }}
