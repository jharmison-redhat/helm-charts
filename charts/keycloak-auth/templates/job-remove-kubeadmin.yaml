{{- if .Values.removeKubeAdmin }}
apiVersion: batch/v1
kind: Job
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: remove-kubeadmin
      restartPolicy: Never
      containers:
      - name: remove-kubeadmin
        image: {{ .Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command: ["oc"]
        args:
          - delete
          - secret
          - kubeadmin
          - --namespace
          - kube-system
          - --ignore-not-found
          # No wait keeps the Job's authority delete-only (waiting polls the
          # Secret with get/watch); success means the API accepted the
          # deletion request, not that a replacement login was verified.
          - --wait=false
{{- end }}
