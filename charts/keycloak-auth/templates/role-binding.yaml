{{- if .Values.removeKubeAdmin }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remove-kubeadmin
subjects:
  - kind: ServiceAccount
    name: remove-kubeadmin
    namespace: kube-system
{{- end }}
