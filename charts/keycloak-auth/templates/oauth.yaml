{{- $secret := .Values.global.oidc | default dict }}
{{- $secret = $secret.secret | default "" }}
{{- /* The OAuth identity provider is useless without its client secret, so
both the OAuth CR and the openid-client-secret Secret are gated on
global.oidc.secret being provided */ -}}
{{- if ne $secret "" }}
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
  labels:
    {{- include "keycloak-auth.labels" . | nindent 4 }}
spec:
  identityProviders:
    - name: {{ .Values.oauth.idpName }}
      type: OpenID
      mappingMethod: claim
      openID:
        {{- with .Values.ingressCA }}
        ca:
          name: router-ca
        {{- end }}
        claims:
          email:
            - email
          name:
            - name
          preferredUsername:
            - preferred_username
            - email
            - name
          groups:
            - groups
        clientID: {{ .Values.global.oidc.clientId }}
        clientSecret:
          name: openid-client-secret
        extraScopes: []
        issuer: >-
          https://{{ .Values.keycloak.name }}.{{ .Values.global.wildcardDomain }}/realms/{{ .Values.global.oidc.realm }}
{{- end }}
