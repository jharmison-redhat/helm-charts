# Real defaults live here — override as needed by a chart consumer. Secrets
# are never defaulted: the OIDC client secret must be provided explicitly.

global:

  # Wildcard domain under which the Keycloak instance is exposed
  # (<keycloak.name>.<wildcardDomain>) — must match the keycloak chart's
  # global.wildcardDomain
  wildcardDomain: apps.cluster.example.com

  # Image for the kubeadmin-removal Job container (requires the `oc` CLI)
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

  # Single-source OIDC settings shared with the keycloak chart through
  # global propagation. realm must match a keycloak chart `realms` map key
  # and clientId must match a client name within it — both are structural
  # in the keycloak chart and cannot reference these values. Setting realm
  # to a name with no matching realm in the keycloak chart makes the issuer
  # point at a realm that was never imported (no fail-fast). Leave secret
  # empty to skip rendering the OAuth resource and the
  # openid-client-secret Secret.
  oidc:
    realm: sso
    clientId: ocp-idp
    secret: ""

nameOverride: ""
fullnameOverride: ""

keycloak:
  # Name of the Keycloak CR deployed by the keycloak chart — matches its
  # chart-name-based CR name by default. If an umbrella renames the
  # keycloak subchart, this must be updated to match or the issuer hostname
  # silently points at the wrong CR name.
  name: keycloak

oauth:
  # Name of the OpenID identity provider in the cluster OAuth resource
  idpName: rhbk

# Optional CA bundle; when set, this chart also renders the router-ca
# ConfigMap in openshift-config and the OAuth identity provider references it
ingressCA: ""

clusterAdmins:
  users:
    - admin

# Set false to keep the kubeadmin Secret in place
removeKubeAdmin: true
