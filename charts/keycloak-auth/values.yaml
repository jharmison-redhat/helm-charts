# Real defaults live here — override as needed by a chart consumer. Secrets
# are never defaulted: the OIDC client secret must be provided explicitly.

global:

  # Wildcard domain under which the Keycloak instance is exposed
  # (<keycloak.name>.<wildcardDomain>) — must match the keycloak chart's
  # global.wildcardDomain
  wildcardDomain: apps.cluster.example.com

  # Image for the hook Job containers (kubeadmin removal and OAuth identity
  # provider upsert/remove — requires the `oc` CLI plus jq or python3)
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

  # Single-source OIDC settings shared with the keycloak chart through
  # global propagation. realm must match a keycloak chart `realms` map key
  # and clientId must match a client name within it — both are structural
  # in the keycloak chart and cannot reference these values. Setting realm
  # to a name with no matching realm in the keycloak chart makes the issuer
  # point at a realm that was never imported (no fail-fast). Leave secret
  # empty to skip rendering the identity-provider hook Jobs, their
  # oauth-idp ServiceAccount/ClusterRole/ClusterRoleBinding, the
  # oauth-idp-config ConfigMap, and the openid-client-secret Secret.
  # consoleHost optionally names the OpenShift web console host for the
  # single-logout wiring (logoutRedirect below and the keycloak chart's
  # oidcLogoutRedirect): both derive it from this value when set, else
  # from console-openshift-console.<wildcardDomain>.
  oidc:
    realm: sso
    clientId: ocp-idp
    secret: ""
    consoleHost: ""

nameOverride: ""
fullnameOverride: ""

keycloak:
  # Name of the Keycloak CR deployed by the keycloak chart — matches its
  # chart-name-based CR name by default. If an umbrella renames the
  # keycloak subchart, this must be updated to match or the issuer hostname
  # silently points at the wrong CR name.
  name: keycloak

oauth:
  # Name of the OpenID identity provider entry the hook Jobs manage in the
  # platform's cluster OAuth resource; all other entries there are preserved
  idpName: rhbk

logoutRedirect:
  # Front-channel single logout: on console logout the browser is sent to the Keycloak
  # RP-initiated logout endpoint, ending the SSO session (the OAuth server cannot do this
  # itself — documented OCP limitation). Requires the OIDC IdP (global.oidc.secret) to be
  # set. The console host derives from global.oidc.consoleHost when set, else
  # console-openshift-console.<global.wildcardDomain> — the same single source the keycloak
  # chart uses for the client's post.logout.redirect.uris attribute.
  enabled: true

# Optional CA bundle; when set, this chart also renders the router-ca
# ConfigMap in openshift-config and the OAuth identity provider references it
# (only needed when the identity provider's serving certificate is issued by private enterprise PKI — a CA that is
# neither publicly trusted nor the cluster's own, whose CA the OAuth server already trusts; the cluster's default
# ingress certificate needs no value)
ingressCA: ""

clusterAdmins:
  users:
    - admin

# Default false: deleting the kubeadmin Secret is irreversible — Helm
# rollback/uninstall does not recreate it, and this chart cannot verify that
# a replacement administrator login works. Opt in only after exercising that
# login.
removeKubeAdmin: false
