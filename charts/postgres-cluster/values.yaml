nameOverride: ""
fullnameOverride: ""

# Namespace for the Cluster resources; empty means the release namespace
namespace: ""

labels: {}
annotations: {}

# PostgreSQL server image; empty uses the CloudNativePG operator default
image: ""

# Number of PostgreSQL instances in the cluster
instances: 2

storage:
  size: 10Gi
  # Empty omits `storageClass` from the Cluster CR, using the cluster default StorageClass
  storageClass: ""

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Extra WAL storage configuration passed through to the Cluster CR
walStorage: {}

# Extra `managed` block entries passed through to the Cluster CR
managed: {}

# Operator-created default services. Remove entries to disable the
# corresponding default service — specifying `services` in the `managed` block
# while a default service is disabled makes the chart fail at render time.
services:
  - rw
  - ro
  - r

certificate:
  enabled: true
  # Extra DNS suffix below the `svc` domain (e.g. cluster.local)
  clusterDomain: cluster.local
  # Must resolve to a CA-capable issuer (CA, SelfSigned, or Vault): the
  # referenced Secret doubles as `serverCASecret` and needs a `ca.crt`, which
  # cert-manager only populates for CA-capable issuers — not ACME.
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

# Map of backup schedules — one ScheduledBackup is rendered per entry, and the
# Cluster's volume-snapshot backup configuration comes from the first entry.
backups: {}
#  daily:
#    schedule: "0 30 1 * * 6" # 1:30 AM on Saturdays
#    method: volumeSnapshot
#    ownerReference: self
#    volumeSnapshot:
#      className: csi-aws-vsc

# Map of application databases — one Database CR is rendered per entry, plus a
# basic-auth Secret when the entry provides a `password`. Specifying `roles` in
# the `managed` block while `databases` is non-empty makes the chart fail at
# render time.
# With the map empty, the default CloudNativePG bootstrap creates the `app`
# database owned by `app`, with the credentials in a `<cluster>-app` Secret.
databases: {}
#  keycloak:
#    # User owning the database (defaults to the entry name)
#    user: keycloak
#    # Password for the owning user — when provided, a basic-auth Secret named
#    # <cluster>-<user>-<database> is rendered and wired to a managed role;
#    # omit it to let the operator manage the role password
#    password: <password>
#    # extraRoleSpec / spec / labels / annotations are passed through to the
#    # managed role / Database CR / both respectively

# Bootstrap recovery target; when set, it replaces the initdb bootstrap
recovery: {}
