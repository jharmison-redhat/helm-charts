{{- range $name, $db := .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "postgres-cluster.fullname" $ }}-{{ $name }}
  {{- with $.Values.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "postgres-cluster.labels" $ | nindent 4 }}
    {{- with $db.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $db.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  name: {{ $name }}
  owner: {{ $db.user | default $name }}
  cluster:
    name: {{ include "postgres-cluster.fullname" $ }}
  {{- with $db.spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
