{{- if eq (include "keycloak.enabled" .Values.postgresCluster) "true" }}
{{- with .Values.postgresCluster }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
  labels:
    {{- include "keycloak.labels" $ | nindent 4 }}
spec:
  instances: {{ .instances }}
  storage:
    {{- toYaml .storage | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .name }}
      owner: {{ .name }}
  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
