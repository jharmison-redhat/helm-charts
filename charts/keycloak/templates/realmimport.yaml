{{- range $name, $realm := .Values.realms }}
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
  labels:
    {{- include "keycloak.labels" $ | nindent 4 }}
spec:
  keycloakCRName: {{ include "keycloak.name" $ }}
  realm:
    id: {{ $name }}
    realm: {{ $name }}
    enabled: true
    sslRequired: external
    registrationAllowed: {{ $realm.registrationAllowed | default false }}
    loginWithEmailAllowed: {{ $realm.loginWithEmailAllowed | default true }}
    duplicateEmailsAllowed: {{ $realm.duplicateEmailsAllowed | default false }}
    resetPasswordAllowed: {{ $realm.resetPasswordAllowed | default false }}
    editUsernameAllowed: {{ $realm.editUsernameAllowed | default false }}
    bruteForceProtected: {{ $realm.bruteForceProtected | default true }}
    accessTokenLifespan: {{ $realm.accessTokenLifespan | default 300 }}
    ssoSessionIdleTimeout: {{ $realm.ssoSessionIdleTimeout | default 1800 }}
    ssoSessionMaxLifespan: {{ $realm.ssoSessionMaxLifespan | default 36000 }}
    offlineSessionIdleTimeout: {{ $realm.offlineSessionIdleTimeout | default 2592000 }}
    {{- with $realm.clientScopes }}
    clientScopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $realm.clients }}
    clients:
      {{- range $cid, $client := . }}
      - clientId: {{ $cid }}
        {{- with $client.name }}
        name: {{ . }}
        {{- end }}
        {{- with $client.description }}
        description: {{ . }}
        {{- end }}
        enabled: {{ $client.enabled | default true }}
        {{- if not ($client.publicClient | default false) }}
        clientAuthenticatorType: {{ $client.clientAuthenticatorType | default "client-secret" }}
        {{- end }}
        {{- with $client.secret }}
        secret: {{ . }}
        {{- end }}
        publicClient: {{ $client.publicClient | default false }}
        redirectUris:
          {{- toYaml (default (list "*") $client.redirectUris) | nindent 10 }}
        webOrigins:
          {{- toYaml (default (list "*") $client.webOrigins) | nindent 10 }}
        standardFlowEnabled: {{ $client.standardFlowEnabled | default true }}
        directAccessGrantsEnabled: {{ $client.directAccessGrantsEnabled | default true }}
        serviceAccountsEnabled: {{ $client.serviceAccountsEnabled | default true }}
        frontchannelLogout: {{ $client.frontchannelLogout | default false }}
        protocol: {{ $client.protocol | default "openid-connect" }}
        {{- with $client.attributes }}
        attributes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $client.fullScopeAllowed }}
        fullScopeAllowed: {{ . }}
        {{- end }}
        {{- with $client.defaultClientScopes }}
        defaultClientScopes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $client.optionalClientScopes }}
        optionalClientScopes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
    roles:
      realm:
        - name: admin
          description: Administrator role
        {{- range $rname, $role := $realm.roles }}
        - name: {{ $rname }}
          {{- if $role }}
          {{- toYaml $role | nindent 10 }}
          {{- end }}
        {{- end }}
    users:
      {{- $generated := $realm.generated | default dict }}
      {{- range $i := until (int ($generated.count | default 0)) }}
      {{- $username := printf "%s%s" ($generated.prefix | default "user") (toString (add 1 $i)) }}
      - username: {{ $username }}
        enabled: true
        emailVerified: true
        email: {{ printf "%s@%s" $username $.Values.emailDomain }}
        firstName: {{ title $username }}
        lastName: Demo
        credentials:
          - type: password
            value: {{ required (printf "realm %s: generated.password is required when generated.count > 0" $name) $generated.password | quote }}
            temporary: false
        realmRoles:
          - user
      {{- end }}
      {{- range $username, $user := $realm.users }}
      - username: {{ $username }}
        enabled: {{ $user.enabled | default true }}
        emailVerified: {{ $user.emailVerified | default true }}
        email: {{ $user.email | default (printf "%s@%s" $username $.Values.emailDomain) }}
        firstName: {{ $user.firstName | default (title $username) }}
        lastName: {{ $user.lastName | default "Demo" }}
        {{- if $user.credentials }}
        credentials:
          {{- toYaml $user.credentials | nindent 10 }}
        {{- else if $user.password }}
        credentials:
          - type: password
            value: {{ $user.password | quote }}
            temporary: false
        {{- end }}
        {{- with $user.realmRoles }}
        realmRoles:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $user.groups }}
        groups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with $realm.admin }}
      - username: {{ .username }}
        enabled: true
        emailVerified: true
        email: {{ .email | default (printf "%s@%s" .username $.Values.emailDomain) }}
        firstName: {{ .firstName | default (title .username) }}
        lastName: {{ .lastName | default "Demo" }}
        credentials:
          - type: password
            value: {{ required (printf "realm %s admin password is required" $name) .password | quote }}
            temporary: false
        realmRoles:
          - admin
          {{- with .realmRoles }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      {{- end }}
    {{- if $realm.groups }}
    groups:
      {{- toYaml $realm.groups | nindent 6 }}
    {{- else if $realm.groupsFromRoles }}
    groups:
      - name: admins
      {{- range $rname, $role := $realm.roles }}
      - name: {{ $rname }}
      {{- end }}
    {{- end }}
    {{- with $realm.defaultRoles }}
    defaultRoles:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
