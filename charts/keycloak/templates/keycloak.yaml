{{- $db := .Values.db | default dict }}
{{- $pg := .Values.postgresCluster }}
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ include "keycloak.name" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  db:
    vendor: postgres
    database: {{ $db.database | default $pg.name }}
    host: {{ $db.host | default (printf "%s-rw" $pg.name) }}
    usernameSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $pg.name) }}
      key: username
    passwordSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $pg.name) }}
      key: password
  hostname:
    hostname: {{ include "keycloak.name" . }}.{{ .Values.global.wildcardDomain }}
    strict: false
    strictBackchannel: false
  http:
    httpEnabled: false
    tlsSecret: {{ include "keycloak.name" . }}-internal-tls
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: {{ include "keycloak.name" . }}-internal-tls
  ingress:
    enabled: false
  instances: {{ .Values.replicas }}
  transaction:
    xaEnabled: true
  additionalOptions:
    - name: enable-recovery
      value: 'true'
