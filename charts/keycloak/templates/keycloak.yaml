{{- $db := .Values.db | default dict }}
{{- $pg := index .Values "postgres" | default dict }}
{{- $pgAvailable := and (hasKey .Values "postgres") $pg.enabled }}
{{- if not $pgAvailable }}
{{- if or (not $db.host) (not $db.database) (not $db.credentialsSecret) }}
{{- fail "postgres-cluster dependency is disabled or its values block is absent: provide postgres-cluster values so the cluster name is stable, or set db.host, db.database and db.credentialsSecret overrides for an external database" }}
{{- end }}
{{- end }}
{{- $cluster := include "keycloak.pg.fullname" . }}
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ include "keycloak.name" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  db:
    vendor: postgres
    database: {{ $db.database | default "app" }}
    host: {{ $db.host | default (printf "%s-rw" $cluster) }}
    usernameSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $cluster) }}
      key: username
    passwordSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $cluster) }}
      key: password
  hostname:
    hostname: {{ include "keycloak.name" . }}.{{ .Values.global.wildcardDomain }}
    strict: false
    strictBackchannel: false
  http:
    httpEnabled: false
    tlsSecret: {{ include "keycloak.name" . }}-internal-tls
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: {{ include "keycloak.name" . }}-internal-tls
  ingress:
    enabled: false
  instances: {{ .Values.replicas }}
  transaction:
    xaEnabled: true
  additionalOptions:
    - name: enable-recovery
      value: 'true'
