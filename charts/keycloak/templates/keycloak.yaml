{{- $db := .Values.db | default dict }}
{{- $pg := index .Values "postgres" | default dict }}
{{- $pgAvailable := and (hasKey .Values "postgres") $pg.enabled }}
{{- if not $pgAvailable }}
{{- if or (not $db.host) (not $db.database) (not $db.credentialsSecret) }}
{{- fail "postgres-cluster dependency is disabled or its values block is absent: provide postgres values so the cluster name is stable, or set db.host, db.database and db.credentialsSecret overrides for an external database" }}
{{- end }}
{{- else }}
{{- $pgNamespace := $pg.namespace | default .Release.Namespace }}
{{- if ne $pgNamespace "keycloak" }}
{{- fail (printf "postgres.namespace must stay 'keycloak' (got %q): the Keycloak CR pins the keycloak namespace and the db host defaults to the same-namespace short-name DNS (%s-rw), so a Cluster in any other namespace would silently break the database connection — set postgres.namespace: 'keycloak' (the default) or, for a database elsewhere, disable the postgres dependency and supply db.host/db.database/db.credentialsSecret overrides" $pgNamespace (include "keycloak.pg.fullname" .)) }}
{{- end }}
{{- end }}
{{- $cluster := include "keycloak.pg.fullname" . }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ include "keycloak.name" . }}
  namespace: keycloak
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  db:
    vendor: postgres
    database: {{ $db.database | default "app" }}
    host: {{ $db.host | default (printf "%s-rw" $cluster) }}
    usernameSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $cluster) }}
      key: username
    passwordSecret:
      name: {{ $db.credentialsSecret | default (printf "%s-app" $cluster) }}
      key: password
  hostname:
    hostname: {{ include "keycloak.name" . }}.{{ .Values.global.wildcardDomain }}
    strict: false
    strictBackchannel: false
  http:
    httpEnabled: false
    tlsSecret: {{ include "keycloak.name" . }}-internal-tls
  ingress:
    enabled: false
  instances: {{ .Values.replicas }}
  transaction:
    xaEnabled: true
  additionalOptions:
    - name: enable-recovery
      value: 'true'
