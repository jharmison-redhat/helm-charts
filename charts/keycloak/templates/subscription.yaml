{{- $operator := .Values.operator | default dict }}
{{- if eq (include "keycloak.enabled" ($operator.subscription | default dict)) "true" }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  channel: {{ $operator.channel | default "stable-v26.2" }}
  installPlanApproval: {{ $operator.installPlanApproval | default "Automatic" }}
  name: rhbk-operator
  source: {{ $operator.catalog | default "redhat-operators" }}
  sourceNamespace: openshift-marketplace
{{- end }}
