global:
  # Wildcard domain under which the Keycloak hostname is exposed
  # (<name>.<wildcardDomain>)
  wildcardDomain: apps.cluster.example.com

  # Image for Helm hook Job containers (requires the `oc` CLI)
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

# Override the rendered resource names
nameOverride: ""
fullnameOverride: ""

# Namespace for the Keycloak resources; empty means the release namespace
namespace: ""

# Number of Keycloak instances
replicas: 1

# Domain used for realm-user email defaults (userN@<emailDomain>)
emailDomain: example.com

# RHBK operator install via the install-operators dependency. Disable the
# whole block (install-operators.enabled: false) to manage the operator
# yourself — e.g. from an umbrella chart composing install-operators directly.
install-operators:
  enabled: true
  operators:
    rhbk-operator:
      enabled: true
      channel: stable-v26.2
      namespace: keycloak
      operatorGroup:
        enabled: true
        targetNamespaces:
          - keycloak

    cloudnative-pg:
      enabled: true
      channel: stable-v1
      catalog: certified-operators

# PostgreSQL Cluster backing the Keycloak instance, deployed through the
# postgres-cluster chart dependency. The default cluster follows the CNPG
# default bootstrap (the `app` database owned by `app`, credentials in a
# `keycloak-postgres-app` Secret) so the Keycloak CR's db block can consume it
# by naming convention. With the dependency disabled, the `db` block below
# overrides the external database connection.
postgres-cluster:
  enabled: true
  fullnameOverride: keycloak-postgres
  instances: 1
  storage:
    size: 2Gi
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 256Mi

# External database overrides, used when the postgres-cluster dependency is
# disabled (all three keys are then required).
db: {}
#  host: keycloak-postgres-rw.example-database.svc:5432
#  database: keycloak
#  credentialsSecret: keycloak-db-credentials

