global:
  # Wildcard domain under which the Keycloak hostname is exposed
  # (<name>.<wildcardDomain>)
  wildcardDomain: apps.cluster.example.com

  # Single-source OIDC settings shared with the keycloak-auth chart through
  # global propagation. realm must match a `realms` map key below and
  # clientId must match a client name within it — the realm map key and
  # client name are structural and cannot reference these values. Setting
  # realm to a name with no matching `realms` entry makes the issuer point
  # at a realm that was never imported (no fail-fast). The secret is picked
  # up by realm client entries that reference global.oidc.secret via tpl.
  oidc:
    realm: sso
    clientId: ocp-idp
    secret: ""

nameOverride: ""
fullnameOverride: ""

# Namespace for the Keycloak resources; empty means the release namespace
namespace: ""

replicas: 1

# Domain used for realm-user email defaults (userN@<emailDomain>)
emailDomain: example.com

# NOTE: the RHBK and CloudNativePG operators must already be installed
# before this chart is installed — it renders the Keycloak and
# KeycloakRealmImport custom resources directly, and a plain helm install
# fails on the missing CRDs otherwise.

# PostgreSQL Cluster backing the Keycloak instance, deployed through the
# postgres-cluster chart dependency (aliased to `postgres`, which moves the
# values key). With the dependency disabled, the `db` block below overrides
# the external database connection.
postgres:
  enabled: true
  fullnameOverride: keycloak-postgres
  instances: 1
  storage:
    size: 2Gi
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 256Mi

# External database overrides, used when the postgres dependency is
# disabled (all three keys are then required).
db: {}
#  host: keycloak-postgres-rw.example-database.svc:5432
#  database: keycloak
#  credentialsSecret: keycloak-db-credentials

