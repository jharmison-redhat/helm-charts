# All keys are optional — defaults live in the templates. Uncomment and adjust

# global:

# # Wildcard domain under which the Keycloak hostname is exposed

# # (<name>.<wildcardDomain>)

# wildcardDomain: apps.cluster.example.com

# # Image for Helm hook Job containers (requires the `oc` CLI)

# toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

# Override the rendered resource names

# nameOverride: ""

# fullnameOverride: ""

# Namespace for the Keycloak resources and the RHBK operator; defaults to the

# release namespace

# namespace: keycloak

# Number of Keycloak instances

# replicas: 1

# Domain used for realm-user email defaults (userN@<emailDomain>)

# emailDomain: example.com

# Optional CA bundle mounted as the router-ca ConfigMap in openshift-config, and

# referenced by the keycloak-auth chart's OAuth identity provider

# ingressCA: |

# -----BEGIN CERTIFICATE-----

# ...

# -----END CERTIFICATE-----

# operator:

# channel: stable-v26.2

# catalog: redhat-operators

# installPlanApproval: Automatic

# subscription:

# enabled: true

# operatorGroup:

# enabled: true

# realms:

# sso:

# registrationAllowed: false

# # Generate users user1..userN with the given password

# generated:

# prefix: user

# count: 5

# password: changeme

# users:

# someuser:

# password: changeme

# realmRoles:

# - user

# groups:

# - users

# admin:

# username: admin

# password: changeme

# # Generate one group per role (plus `admins`) — set to false to supply

# # `groups` explicitly instead

# groupsFromRoles: true

# clients:

# ocp-idp:

# secret: <client-secret> # must match keycloak-auth's openidClient.secret

