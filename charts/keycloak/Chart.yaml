apiVersion: v2
name: keycloak
description: >
  A helm chart to deploy a Keycloak instance using the Red Hat Build of Keycloak operator
type: application
version: 0.2.0
appVersion: 0.2.0
dependencies:
  - name: install-operators
    repository: oci://ghcr.io/jharmison-redhat/helm-charts
    version: ">=0.2.0 <0.3.0"
    condition: install-operators.enabled
  - name: postgres-cluster
    repository: oci://ghcr.io/jharmison-redhat/helm-charts
    version: ">=0.1.0 <0.2.0"
    condition: postgres-cluster.enabled
