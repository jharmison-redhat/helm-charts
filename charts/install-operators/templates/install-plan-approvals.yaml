{{- range $operator, $config := .Values.operators }}
{{- if eq (include "install-operators.operatorEnabled" $config) "true" }}
{{- $manualInstall := eq ($config.installPlanApproval | default "Automatic") "Manual" }}
{{- $approveCSVs := $config.approveCSVs | default list }}
{{- $opNamespace := include "install-operators.operatorNamespace" $config }}
{{- if $manualInstall }}
{{- if not $config.startingCSV }}
{{- fail "Manual approvals with this chart require pinning a specific CSV with startingCSV for the operator" }}
{{- end }}
{{- $approveCSVs = append $approveCSVs $config.startingCSV }}
{{- end }}
{{- if $approveCSVs }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approve-{{ $operator }}
  namespace: {{ $opNamespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: approve-{{ $operator }}
  namespace: {{ $opNamespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
    verbs:
      - get
      - list
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approve-{{ $operator }}
  namespace: {{ $opNamespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: approve-{{ $operator }}
subjects:
- kind: ServiceAccount
  name: approve-{{ $operator }}
  namespace: {{ $opNamespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: approve-{{ $operator }}-script
  namespace: {{ $opNamespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
data:
  approve-operator.sh: |-
    {{- tpl ($.Files.Get "files/approve-operator.sh") (list $operator $config) | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-{{ $operator }}
  namespace: {{ $opNamespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- /* Weight 1 runs the approve Job after the weight-0
    subscription-set Jobs (Helm executes hooks in ascending weight order):
    under installPlanApproval: Manual the approve Job polls for an
    InstallPlan the Subscription produces, so the Subscription must exist
    first. */}}
    helm.sh/hook-weight: "1"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: approve-{{ $operator }}
      restartPolicy: Never
      containers:
        - name: approve-operator
          image: {{ $.Values.global.toolsImage }}
          imagePullPolicy: IfNotPresent
          command: ["/mnt/approve-operator.sh"]
          securityContext:
            {{- include "common.hook-security-context" . | nindent 12 }}
          volumeMounts:
            - name: approve-operator-script
              mountPath: /mnt
      volumes:
        - name: approve-operator-script
          configMap:
            name: approve-{{ $operator }}-script
            defaultMode: 493
{{- end }}
{{- end }}
{{- end }}
