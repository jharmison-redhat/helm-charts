{{- include "install-operators.validateValues" . }}
{{- range $operator, $config := .Values.operators }}
{{- if eq (include "install-operators.operatorEnabled" $config) "true" }}
{{- $sub := dict "operator" $operator "config" $config "root" $ }}
{{- if $config.ownSubscription }}
---
{{ include "install-operators.subscription" $sub }}
{{- else }}
{{- /* The Subscription is maintained by a conditional-write hook pair, not
owned by the release: the set Job converges the chart-managed fields on every
install/upgrade (a one-shot apply leaves the Subscription drifting after its
first run), and the remove Job deletes it on uninstall only when the set hook
created it. The comment action must not right-trim: the newline it would eat
is the one separating the previous iteration's last line from this `---`
document separator (a right-trim glues them into one YAML document). */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: install-{{ $operator }}
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: install-{{ $operator }}
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    resourceNames:
      - {{ $operator }}
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: install-{{ $operator }}
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: install-{{ $operator }}
subjects:
  - kind: ServiceAccount
    name: install-{{ $operator }}
    namespace: {{ include "install-operators.operatorNamespace" $config }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: install-{{ $operator }}-config
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
data:
  hook-preamble.sh: |-
    {{- $.Files.Get "files/lib/hook-preamble.sh" | nindent 4 }}
  subscription-set.sh: |-
    {{- $.Files.Get "files/subscription-set.sh" | nindent 4 }}
  subscription-remove.sh: |-
    {{- $.Files.Get "files/subscription-remove.sh" | nindent 4 }}
  subscription.json: {{ include "install-operators.subscriptionPayload" $sub | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-{{ $operator }}-set
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: install-{{ $operator }}
      restartPolicy: Never
      containers:
        - name: subscription-set
          image: {{ $.Values.global.toolsImage }}
          imagePullPolicy: IfNotPresent
          command: ["/mnt/subscription-set.sh"]
          securityContext:
            {{- include "install-operators.hookSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: subscription-script
              mountPath: /mnt
      volumes:
        - name: subscription-script
          configMap:
            name: install-{{ $operator }}-config
            defaultMode: 493
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-{{ $operator }}-remove
  namespace: {{ include "install-operators.operatorNamespace" $config }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: install-{{ $operator }}
      restartPolicy: Never
      containers:
        - name: subscription-remove
          image: {{ $.Values.global.toolsImage }}
          imagePullPolicy: IfNotPresent
          command: ["/mnt/subscription-remove.sh"]
          securityContext:
            {{- include "install-operators.hookSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: subscription-script
              mountPath: /mnt
      volumes:
        - name: subscription-script
          configMap:
            name: install-{{ $operator }}-config
            defaultMode: 493
{{- end }}
{{- end }}
{{- end }}
