{{- range $operator, $config := .Values.operators }}
{{- if eq (include "install-operators.operatorEnabled" $config) "true" }}
{{- if $config.namespace }}
{{- if $config.operatorGroup }}
{{- if $config.operatorGroup.enabled }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ $operator }}
  namespace: {{ $config.namespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
spec:
  upgradeStrategy: {{ $config.operatorGroup.upgradeStrategy | default "Default" }}
  {{- with $config.operatorGroup.targetNamespaces }}
  targetNamespaces:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
