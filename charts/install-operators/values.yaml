global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

operators: {}
# Each operator config supports an `enabled` toggle (default: true). Set it to
# `false` to skip rendering that operator's resources entirely.
#
# By default the operator's Subscription is NOT a release manifest: it is
# created and kept up to date by hook Jobs on every install and upgrade, and
# removed on uninstall only if the chart created it. Set `ownSubscription:
# true` to opt into a release-owned Subscription for that operator
# (GitOps tools can then own and continuously reconcile it — see the README
# caveats).
#
# Entries with an explicit `namespace` get that namespace ensured by a
# pre-install hook: created when absent, and when present merged additively
# with the entry's `namespaceLabels` and `namespaceAnnotations` only. The hook
# refuses to overwrite any of those keys with a foreign value, so keep the
# values for a shared namespace identical across entries. Namespaces are never
# deleted on uninstall.
#
# devspaces:
#   enabled: true
#   channel: stable
# openshift-cert-manager-operator:
#   enabled: true
#   channel: stable-v1
#   namespace: cert-manager-operator
#   operatorGroup:
#     enabled: true
# leader-worker-set:
#   enabled: true
#   channel: stable-v1.0
#   namespace: openshift-lws-operator
#   operatorGroup:
#     enabled: true
#     targetNamespaces:
#       - openshift-lws-operator
# rhods-operator:
#   enabled: true
#   channel: fast-3.x
#   installPlanApproval: Manual
#   startingCSV: rhods-operator.3.2.0
#   namespace: redhat-ods-operator
#   operatorGroup:
#     enabled: true
# rhcl-operator:
#   channel: stable
#   approveCSVs:
#     - rhcl-operator.v1.2.1
# cloudnative-pg:
#   enabled: true
#   channel: stable-v1
#   catalog: certified-operators
# cluster-observability-operator:
#   enabled: true
#   channel: stable
#   namespace: openshift-cluster-observability-operator
#   installPlanApproval: Manual
#   startingCSV: cluster-observability-operator.v1.4.0
#   operatorGroup:
#     enabled: true
