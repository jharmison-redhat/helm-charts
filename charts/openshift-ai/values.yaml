# Dashboard templates hidden from the workbench spawner.
# templateDisablement:
#   - trustyai-cpu-small

# Ordering of templates in the workbench spawner.
# templateOrder:
#   - jupyter-minimal-notebook
#   - jupyter-datascience-notebook

defaultWorkbenchPvcSize: 20Gi
showJupyterInEnabledApplications: true
notebookIdleCulling:
  enabled: true
  timeoutInMinutes: 240

# maas-db bootstrap job plumbing. The job reads the `<name>-app` secret
# created by the postgres-cluster release and mirrors its connection URI into
# a maas-db-config secret in the maas-api namespace. The target namespace must
# already exist before this chart installs — neither this chart nor the
# postgres-cluster dependency renders a Namespace.
#
# EITHER/OR: managed mode (maasDb.create: true) deploys the Cluster through
# the aliased postgres-cluster dependency and derives the secret name from the
# fullname convention; out-of-band mode (maasDb.secretName set, create false)
# renders the job against an external Cluster whose `<fullname>-app` secret
# already exists. With both unset, nothing renders.
maasDb:
  # Feature toggle and postgres-cluster dependency condition: true brings the
  # Cluster (rendered in postgres.namespace) plus the bootstrap job; false
  # relies on maasDb.secretName for the out-of-band mode
  create: false
  # In managed mode, must match postgres.namespace — the Cluster renders
  # there and the job looks the secret up there. Must already exist before
  # this chart installs: neither this chart nor the postgres-cluster
  # dependency renders a Namespace
  namespace: redhat-ai-gateway-infra
  # Out-of-band override: name of the secret holding the postgres connection
  # URI. Empty in managed mode — the job then derives `<fullname>-app` from
  # the Cluster created by the dependency.
  secretName: ""
  # Bounded wall-clock wait (seconds) for the source secret to appear before
  # the bootstrap job fails; the Job's activeDeadlineSeconds is
  # waitTimeoutSeconds + 30. Must be a positive integer
  waitTimeoutSeconds: 240

# PostgreSQL Cluster backing the maas-db (managed mode), deployed through the
# postgres-cluster chart dependency (aliased to `postgres`, gated by
# maasDb.create). Rendered only when maasDb.create is true.
postgres:
  namespace: redhat-ai-gateway-infra
  instances: 2
  storage:
    size: 2Gi
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 256Mi

maasPayloadProcessingNetworkPolicy:
  create: false

# Bounded configuration of the product-managed MaasTenantConfig/default-tenant
# singleton (created automatically by the maas-controller). Renders a
# post-install,post-upgrade hook Job in the release namespace that waits for
# the singleton to appear, then merge-patches ONLY the spec block below.
# Enabled requires the DSC aigateway.modelsAsAService component to be Managed.
#
# Settings persist after uninstall, value removal or hook disablement: an
# explicit null inside spec removes a field, omission does not reset it. Helm
# rollback does not revert this side effect.
maasTenantConfig:
  # Feature toggle: render the hook. Enabling with an empty spec fails at
  # render time — the spec map must carry explicit user settings
  enabled: false
  # Product default namespace, NOT a discovered cluster name. The singleton
  # name is fixed as default-tenant (product CEL singleton) and is not
  # configurable
  namespace: models-as-a-service
  # Bounded wait for the asynchronous singleton creation on first install;
  # the hook fails explicitly on timeout
  waitTimeoutSeconds: 240
  pollIntervalSeconds: 5
  # Explicit user-supplied spec merge-patch — no chart-side defaults are
  # merged. Representative telemetry settings:
  # spec:
  #   telemetry:
  #     metrics:
  #       captureUser: false
  spec: {}

# DSC spec-level list of namespaces where MLflow deployments are allowed
# (Tech Preview) — pairs with the mlflowoperator component above.
# globalMLflowNamespaces: []

mlflow:
  create: true
  spec:
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    backendStoreUri: "sqlite:////mlflow/mlflow.db"
    artifactsDestination: "file:///mlflow/artifacts"
    serveArtifacts: true
    image:
      imagePullPolicy: IfNotPresent

evalhub:
  create: false
  spec:
    replicas: 1
    database:
      type: sqlite
    env:
      - name: MLFLOW_TRACKING_URI
        value: https://mlflow.redhat-ods-applications.svc.cluster.local:8443
  tenant:
    create: true
    namespace: evalhub-tenant
    # Bounded wall-clock wait (seconds) for the ds-pipeline-s3-dspa secret to
    # appear before the credential Job fails; the Job's activeDeadlineSeconds
    # is waitTimeoutSeconds + 30. Must be a positive integer
    waitTimeoutSeconds: 240
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: developer
