---
global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
  cluster:
    name: cluster
    baseDomain: example.com

rbac:
  create: true
  group: system:authenticated:oauth

mcpServers: {}

gateways:
  maasDefaultGateway:
    # only created if enabled in DSC
    useRoute: false
    # GatewayClass referenced by this Gateway. Enabling the OpenShift AI
    # gateway installs the data-science-gateway-class; the class itself is not
    # rendered by this chart
    gatewayClassName: data-science-gateway-class
    # LabelSelector authorizing which namespaces may attach Routes to this
    # Gateway. Label the authorized namespaces explicitly — an empty selector
    # is rejected at render time because it would allow all namespaces
    routeNamespaceSelector:
      matchLabels:
        maas-gateway-access: "true"
    # Replica count of the generated gateway Deployment, applied through the
    # ConfigMap deployment overlay. Null omits the field (operator default);
    # explicit values (including zero) render exactly
    replicas: null
    certificate:
      create: true
      clusterIssuer: letsencrypt
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
    disableIpp: false
  openshiftAiInference:
    create: true
    useRoute: false
    gatewayClassName: data-science-gateway-class
    routeNamespaceSelector:
      matchLabels:
        openshift-ai-inference-access: "true"
    replicas: null
    certificate:
      create: true
      clusterIssuer: letsencrypt

enableUserTelemetry: false

# KEDA metrics reader for WVA autoscaling on LLMInferenceService
# Opt-in: only create when WVA/KEDA is actually deployed
kedaMetricsReader:
  create: false

# Set-on-upgrade knobs: override the replica counts of the rhods-dashboard /
# rhods-operator Deployments. Must NOT be set on first install — the
# Deployments do not exist until the rhods-operator creates them, and a
# partial manifest would render an invalid Deployment. Leave unset (null)
# until after the operator has deployed the operands.
dashboardReplicas: null
operatorReplicas: null

dataScienceCluster:
  create: true
  components:
    aipipelines:
      managementState: Managed
    dashboard:
      managementState: Managed
    feastoperator:
      managementState: Managed
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    kserve:
      managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headed
    kueue:
      managementState: Removed
    ogx:
      managementState: Managed
    mlflowoperator:
      managementState: Managed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Managed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Managed
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks

dataScienceClusterInitialization:
  monitoring:
    managementState: Managed
    namespace: redhat-ods-monitoring
    metrics:
      storage:
        size: 5Gi
        retention: 1d

