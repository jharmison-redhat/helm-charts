{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
{{- $host := include "openshift-ai.gateway.hostname" (dict "root" $ "gateway" . "subdomain" "maas") }}
{{- $class := include "openshift-ai.gateway.className" (dict "gateway" .) }}
{{- if .useRoute }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
spec:
  host: {{ $host }}
  port:
    targetPort: 80
  tls:
    insecureEdgeTerminationPolicy: Allow
    termination: edge
  to:
    kind: Service
    name: {{ printf "maas-default-gateway-%s" $class }}
    weight: 100
  wildcardPolicy: None
{{- end }}
{{- end }}
{{- end }}
