{{- if and (eq (include "openshift-ai.maasManaged" .) "true") .Values.maasTenantConfig.enabled }}
{{- include "openshift-ai.tenantConfig.validated" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshift-ai.tenantConfig.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.tenantConfig.labels" . | nindent 4 }}
data:
  configure-maas-tenant.sh: |
    {{- .Files.Get "files/maas-tenant-config/configure-maas-tenant.sh" | nindent 4 }}
  # JSON merge-patch: only the spec block is sent. This surface contains
  # runtime settings, not credentials.
  patch.json: |
    {{- dict "spec" .Values.maasTenantConfig.spec | toPrettyJson | nindent 4 }}
{{- end }}
