{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
{{- $host := include "openshift-ai.gateway.hostname" (dict "root" $ "gateway" . "subdomain" "maas") }}
{{- if and (not .useRoute) .certificate.create }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maas-default-gateway-certificate
  namespace: openshift-ingress
spec:
  dnsNames:
    - {{ $host }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .certificate.clusterIssuer }}
  secretName: maas-default-gateway-cert
{{- end }}
{{- end }}
{{- end }}