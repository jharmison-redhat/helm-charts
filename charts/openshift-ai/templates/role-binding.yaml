{{- if and (eq (include "openshift-ai.maasManaged" .) "true") (or .Values.maasDb.create .Values.maasDb.secretName) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-maas-db-config-edit
  namespace: {{ .Values.maasDb.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: create-maas-db-config
    namespace: {{ .Values.maasDb.namespace }}
{{- end }}
