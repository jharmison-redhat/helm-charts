{{- with .Values.gateways.openshiftAiInference }}
{{- if .create }}
{{- $host := .hostname | default (printf "inference.apps.%s.%s" $.Values.global.cluster.name $.Values.global.cluster.baseDomain) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
spec:
  gatewayClassName: data-science-gateway-class
  {{- if .useRoute }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openshift-ai-inference-config
  {{- end }}
  listeners:
    {{- if .useRoute }}
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ $host }}
      allowedRoutes:
        namespaces:
          from: All
    {{- else }}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ $host }}
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: openshift-ai-inference-cert
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
{{- end }}
