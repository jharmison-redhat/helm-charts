{{- with .Values.gateways.openshiftAiInference }}
{{- if .create }}
{{- $host := include "openshift-ai.gateway.hostname" (dict "root" $ "gateway" . "subdomain" "inference") }}
{{- $class := include "openshift-ai.gateway.className" (dict "gateway" .) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
spec:
  gatewayClassName: {{ $class }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openshift-ai-inference-config
  listeners:
    {{- $sel := (include "openshift-ai.routeNamespaceSelector" (dict "gateway" .) | fromYaml) }}
    {{- if .useRoute }}
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ $host }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            {{- toYaml $sel | nindent 12 }}
    {{- else }}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ $host }}
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: openshift-ai-inference-cert
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            {{- toYaml $sel | nindent 12 }}
    {{- end }}
{{- end }}
{{- end }}
