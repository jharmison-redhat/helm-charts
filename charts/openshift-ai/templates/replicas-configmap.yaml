{{- if eq (include "openshift-ai.replicaSurface.enabled" .) "true" }}
{{- include "openshift-ai.replicaSurface.config.validated" . -}}
{{- $fullname := include "openshift-ai.replicaSurface.fullname" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.replicaSurface.labels" . | nindent 4 }}
data:
  hook-preamble.sh: |-
    {{- .Files.Get "files/lib/hook-preamble.sh" | nindent 4 }}
  wait-for.sh: |-
    {{- .Files.Get "files/lib/wait-for.sh" | nindent 4 }}
  enforce-replicas.sh: |-
    {{- .Files.Get "files/replicas/enforce-replicas.sh" | nindent 4 }}
  restore-replicas.sh: |-
    {{- .Files.Get "files/replicas/restore-replicas.sh" | nindent 4 }}
  components.txt: |
    {{- include "openshift-ai.replicaSurface.components" . | nindent 4 }}
{{- end }}
