{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
{{- $host := include "openshift-ai.gateway.hostname" (dict "root" $ "gateway" . "subdomain" "maas") }}
{{- $class := include "openshift-ai.gateway.className" (dict "gateway" .) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    opendatahub.io/managed: "false"
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: {{ $class }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
    {{- $sel := (include "openshift-ai.routeNamespaceSelector" (dict "gateway" .) | fromYaml) }}
    {{- if .useRoute }}
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ $host }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            {{- toYaml $sel | nindent 12 }}
    {{- else }}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ $host }}
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: maas-default-gateway-cert
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            {{- toYaml $sel | nindent 12 }}
    {{- end }}
{{- end }}
{{- end }}
