{{- with .Values.evalhub }}
{{- if .create }}
{{- with .tenant }}
{{- if .create }}
{{- $tenantNs := .namespace }}
{{- $wait := int (include "openshift-ai.waitSeconds.validated" (dict "field" "evalhub.tenant.waitTimeoutSeconds" "value" $.Values.evalhub.tenant.waitTimeoutSeconds)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: update-secret-minio
  namespace: {{ $tenantNs }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  # The deadline covers the whole bounded wait plus Pod retries
  activeDeadlineSeconds: {{ add $wait 30 }}
  template:
    spec:
      serviceAccountName: patch-secret
      restartPolicy: Never
      containers:
      - name: patch-secret
        image: {{ $.Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/config/update-secret-minio.sh"]
        env:
        - name: TENANT_NAMESPACE
          value: {{ $tenantNs | quote }}
        - name: TENANT_WAIT_TIMEOUT
          value: {{ $wait | quote }}
        volumeMounts:
        - name: script
          mountPath: /config
      volumes:
      - name: script
        configMap:
          name: update-secret-minio-script
          defaultMode: 493
{{- end }}
{{- end }}
{{- end }}
{{- end }}
