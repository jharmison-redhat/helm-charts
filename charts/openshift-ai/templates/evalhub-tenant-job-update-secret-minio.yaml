{{- with .Values.evalhub }}
{{- if .create }}
{{- with .tenant }}
{{- if .create }}
{{- $tenantNs := .namespace }}
{{- $wait := int (include "openshift-ai.waitSeconds.validated" (dict "field" "evalhub.tenant.waitTimeoutSeconds" "value" $.Values.evalhub.tenant.waitTimeoutSeconds)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: update-secret-minio
  namespace: {{ $tenantNs }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  # The deadline covers the whole bounded wait plus Pod retries
  activeDeadlineSeconds: {{ add $wait 30 }}
  template:
    spec:
      serviceAccountName: patch-secret
      restartPolicy: Never
      containers:
      - name: patch-secret
        image: {{ $.Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash"]
        args:
        - -ec
        - |-
          set -o pipefail

          # Fixed poll interval (seconds) and per-request cap; the wait
          # budget is the wall-clock deadline set from TENANT_WAIT_TIMEOUT
          POLL_INTERVAL=2
          REQUEST_TIMEOUT=10
          WAIT_TIMEOUT="${TENANT_WAIT_TIMEOUT:?TENANT_WAIT_TIMEOUT is required}"
          NAMESPACE="${TENANT_NAMESPACE:?TENANT_NAMESPACE is required}"
          SECRET_NAME="ds-pipeline-s3-dspa"

          umask 077
          workdir="$(mktemp -d)"
          cleanup() { rm -rf "$workdir"; }
          trap cleanup EXIT

          deadline=$(( $(date +%s) + WAIT_TIMEOUT ))

          remaining_seconds() { echo $(( deadline - $(date +%s) )); }

          # Same named-secret readiness/error policy as the maas-db
          # bootstrap job: returns 0 when the secret exists, 1 when absent
          # (retry), 2 when the wall-clock budget is exhausted, 3 on any
          # unexpected API failure (Forbidden, Unauthorized, transport
          # errors, ...). A missing secret or namespace yields no marker
          # under --ignore-not-found and is retried.
          check_source_secret() {
            local remaining budget marker
            remaining=$(remaining_seconds)
            if [ "$remaining" -le 0 ]; then
              return 2
            fi
            budget=$remaining
            if [ "$budget" -gt "$REQUEST_TIMEOUT" ]; then
              budget=$REQUEST_TIMEOUT
            fi
            marker="$(oc get secret "$SECRET_NAME" -n "$NAMESPACE" \
              -ojsonpath='{.metadata.name}' --ignore-not-found \
              --request-timeout="${budget}s")" || {
              echo "Error: unexpected failure checking secret ${SECRET_NAME} in namespace ${NAMESPACE}" >&2
              return 3
            }
            [ -n "$marker" ]
          }

          while true; do
            rc=0
            check_source_secret || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$rc" -eq 2 ]; then
              echo "Error: timed out after ${WAIT_TIMEOUT}s waiting for secret ${SECRET_NAME} in namespace ${NAMESPACE}" >&2
              exit 1
            fi
            if [ "$rc" -eq 3 ]; then
              exit 1
            fi
            remaining=$(remaining_seconds)
            if [ "$remaining" -le 0 ]; then
              echo "Error: timed out after ${WAIT_TIMEOUT}s waiting for secret ${SECRET_NAME} in namespace ${NAMESPACE}" >&2
              exit 1
            fi
            if [ "$remaining" -lt "$POLL_INTERVAL" ]; then
              sleep "$remaining"
            else
              sleep "$POLL_INTERVAL"
            fi
          done

          # Decode credentials directly into private files to preserve
          # literal quotes, backslashes and trailing newlines; both pipeline
          # sides are checked
          read_key() {
            local key="$1" file="$2" b64
            b64="$(oc get secret "$SECRET_NAME" -n "$NAMESPACE" \
              -ojsonpath="{.data.${key}}" --request-timeout="${REQUEST_TIMEOUT}s")" || {
              echo "Error: failed to read the ${key} key from secret ${SECRET_NAME} in namespace ${NAMESPACE}" >&2
              return 1
            }
            printf '%s' "$b64" | base64 -d > "$file" || {
              echo "Error: the ${key} key of secret ${SECRET_NAME} is not valid base64" >&2
              return 1
            }
            if ! [ -s "$file" ] || ! grep -q '[^[:space:]]' "$file"; then
              echo "Error: the ${key} key of secret ${SECRET_NAME} is empty" >&2
              return 1
            fi
          }

          read_key accesskey "$workdir/AWS_ACCESS_KEY_ID" || exit 1
          read_key secretkey "$workdir/AWS_SECRET_ACCESS_KEY" || exit 1
          printf '%s' "http://minio-dspa.${NAMESPACE}.svc.cluster.local:9000" > "$workdir/AWS_S3_ENDPOINT"
          printf '%s' "mlpipeline" > "$workdir/AWS_S3_BUCKET"
          printf '%s' "us-east-1" > "$workdir/AWS_DEFAULT_REGION"

          # The CLI encodes the changed data map and patches the Secret;
          # unrelated keys, labels/annotations and ownership are preserved.
          # Error bodies are kept out of stdout/stderr so credentials never
          # leak through client/server diagnostics.
          if ! oc set data "secret/${SECRET_NAME}" -n "$NAMESPACE" \
              --from-file=AWS_ACCESS_KEY_ID="$workdir/AWS_ACCESS_KEY_ID" \
              --from-file=AWS_SECRET_ACCESS_KEY="$workdir/AWS_SECRET_ACCESS_KEY" \
              --from-file=AWS_S3_ENDPOINT="$workdir/AWS_S3_ENDPOINT" \
              --from-file=AWS_S3_BUCKET="$workdir/AWS_S3_BUCKET" \
              --from-file=AWS_DEFAULT_REGION="$workdir/AWS_DEFAULT_REGION" \
              2>"$workdir/set.err"; then
            echo "Error: failed to update the data of secret ${SECRET_NAME} in namespace ${NAMESPACE} — see the pod's private error logs" >&2
            exit 1
          fi
          echo "secret ${SECRET_NAME} updated in namespace ${NAMESPACE}"
        env:
        - name: TENANT_NAMESPACE
          value: {{ $tenantNs | quote }}
        - name: TENANT_WAIT_TIMEOUT
          value: {{ $wait | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
