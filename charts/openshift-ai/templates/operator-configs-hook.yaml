{{- $wait := int (include "openshift-ai.waitSeconds.validated" (dict "field" "operandHookWaitTimeoutSeconds" "value" .Values.operandHookWaitTimeoutSeconds)) -}}
{{- $fullname := include "openshift-ai.hookSurface.fullname" (dict "root" . "family" "operator-configs") -}}
{{- $deadline := add $wait 30 -}}
{{- $telemetry := include "openshift-ai.enableUserTelemetry.validated" . -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
rules:
  # get/patch only, resource-name-scoped to the four operator-created
  # platform configuration surfaces this chart converges — the chart never
  # deletes them, so no delete verb exists here except on the WVA ConfigMap
  # below (the walk-back of a chart-created instance only). The cluster
  # scope of the permission covers the Auth and DSCInitialization singletons
  # (both cluster-scoped, no namespace) and the product namespace the
  # segment-key and WVA ConfigMaps live in (a Role in redhat-ods-applications
  # cannot be used because that namespace does not exist until the operator
  # creates it — the same first-install-independence boundary as the
  # replicaSurface ClusterRole).
  - apiGroups:
      - services.platform.opendatahub.io
    resources:
      - auths
    resourceNames:
      - auth
    verbs:
      - get
      - patch
  - apiGroups:
      - dscinitialization.opendatahub.io
    resources:
      - dscinitializations
    resourceNames:
      - default-dsci
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - odh-segment-key-config
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - workload-variant-autoscaler-saturation-scaling-config
    verbs:
      - get
      - patch
      - delete
  # create is the one grant RBAC cannot scope by name: the WVA ConfigMap is
  # created under the chart-created proof annotation only when the operator
  # has not deployed it yet. Gated with the payload keys — an install without
  # configured wvaOverrides carries no create grant at all.
  {{- if .Values.wvaOverrides }}
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  {{- end }}
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - auths.services.platform.opendatahub.io
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
data:
  hook-preamble.sh: |-
    {{- include "common.hook-preamble" . | nindent 4 }}
  wait-for.sh: |-
    {{- include "common.wait-for" . | nindent 4 }}
  converge-operator-configs.sh: |-
    {{- .Files.Get "files/operator-configs/converge-operator-configs.sh" | nindent 4 }}
  set-chart-created-cr.sh: |-
    {{- .Files.Get "files/lib/set-chart-created-cr.sh" | nindent 4 }}
  delete-chart-created-cr.sh: |-
    {{- .Files.Get "files/lib/delete-chart-created-cr.sh" | nindent 4 }}
  auth-patch.json: |-
    {{- dict "spec" (dict "adminGroups" (list "rhods-admins") "allowedGroups" .Values.userGroups) | toJson | nindent 4 }}
  dsci-patch.json: |-
    {{- dict "spec" (.Values.dataScienceClusterInitialization | default dict) | toJson | nindent 4 }}
  segment-key-patch.json: |-
    {{- dict "data" (dict "segmentKeyEnabled" $telemetry) | toJson | nindent 4 }}
  {{- if .Values.wvaOverrides }}
  {{- $wvaData := dict -}}
  {{- range $name, $override := .Values.wvaOverrides }}
  {{- /* Each value carries a trailing newline so compute_wva_patch's
      exact-string data comparison is idempotent: block-scalar values (how
      the WVA operator's bundle writes them, and how objects created in
      place by other writers read back) end with one, so a converged object
      byte-compares equal instead of being re-patched on every hook run. */ -}}
  {{- $_ := set $wvaData $name (printf "%s\n" (toYaml $override)) }}
  {{- end }}
  wva-create.json: |-
    {{- dict "apiVersion" "v1" "kind" "ConfigMap"
        "metadata" (dict
          "name" "workload-variant-autoscaler-saturation-scaling-config"
          "namespace" "redhat-ods-applications"
          "annotations" (dict "openshift-ai/chart-created" "true"))
        "data" $wvaData | toJson | nindent 4 }}
  wva-patch.json: |-
    {{- dict "data" $wvaData | toJson | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
  annotations:
    # Recreated on every install/upgrade so the immutable Job spec is never
    # rejected; the supporting resources are ordinary release manifests.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $deadline }}
  template:
    metadata:
      labels:
        {{- include "openshift-ai.hookSurface.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      restartPolicy: Never
      containers:
        - name: converge-operator-configs
          image: {{ .Values.global.toolsImage }}
          securityContext:
            {{- include "openshift-ai.hookSecurityContext" . | nindent 12 }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/converge-operator-configs.sh"]
          env:
            - name: WAIT_TIMEOUT
              value: {{ $wait | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
            defaultMode: 493
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-delete
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-ai.hookSurface.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  # The delete has no wait phase — one bounded get/delete round-trip — so a
  # fixed deadline sits far above the expected few-second run while still
  # terminating a wedged pod.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "openshift-ai.hookSurface.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      restartPolicy: Never
      containers:
        - name: delete-wva-config
          image: {{ .Values.global.toolsImage }}
          securityContext:
            {{- include "openshift-ai.hookSecurityContext" . | nindent 12 }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/delete-chart-created-cr.sh"]
          env:
            - name: RESOURCE
              value: configmap/workload-variant-autoscaler-saturation-scaling-config
            - name: OBJECT_NAME
              value: workload-variant-autoscaler-saturation-scaling-config
            - name: OBJECT_NAMESPACE
              value: redhat-ods-applications
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
            defaultMode: 493
