{{- if and .Values.maasDb.create (eq (include "openshift-ai.maasManaged" .) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-maas-db-config
  namespace: {{ .Values.maasDb.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: create-maas-db-config
      restartPolicy: Never
      containers:
        - name: create-maas-db-config
          image: {{ $.Values.global.toolsImage }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/app/create-maas-db-config.sh"]
          args: []
          volumeMounts:
            - name: create-maas-db-config-script
              mountPath: /app
      volumes:
        - name: create-maas-db-config-script
          configMap:
            name: create-maas-db-config-script
            defaultMode: 493
{{- end }}
