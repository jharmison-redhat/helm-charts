{{- if and .Values.maasDb.create (eq (include "openshift-ai.maasManaged" .) "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: create-maas-db-config
  namespace: {{ .Values.maasDb.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-maas-db-config-edit
  namespace: {{ .Values.maasDb.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: create-maas-db-config
    namespace: {{ .Values.maasDb.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-maas-db-config-script
  namespace: {{ .Values.maasDb.namespace }}
data:
{{ tpl ($.Files.Glob "files/*").AsConfig $ | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-maas-db-config
  namespace: {{ .Values.maasDb.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: create-maas-db-config
      restartPolicy: Never
      containers:
        - name: create-maas-db-config
          image: {{ $.Values.global.toolsImage }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/app/create-maas-db-config.sh"]
          args: []
          volumeMounts:
            - name: create-maas-db-config-script
              mountPath: /app
      volumes:
        - name: create-maas-db-config-script
          configMap:
            name: create-maas-db-config-script
            defaultMode: 493
{{- end }}
