{{- with .Values.gateways.openshiftAiInference }}
{{- if .create }}
{{- $replicas := include "openshift-ai.replicas.validated" (dict "value" .replicas) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-ai-inference-config
  namespace: openshift-ingress
data:
  {{- if ne $replicas "" }}
  deployment: |
    spec:
      replicas: {{ $replicas }}
  {{- end }}
  {{- if .useRoute }}
  service: |
    spec:
      type: ClusterIP
  {{- end }}
{{- end }}
{{- end }}
