{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
{{- if .disableIpp }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ipp-disable
  namespace: openshift-ingress
  annotations:
    openshift.io/managed: "false"
spec:
  priority: 0
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc.bbr
      patch:
        operation: REMOVE
{{- end }}
{{- end }}
{{- end }}
