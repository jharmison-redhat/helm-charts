{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  {{- with .resources }}
  deployment: |
    spec:
      template:
        spec:
          containers:
          - name: istio-proxy
            resources:
              {{- toYaml . | nindent 16 }}
  {{- end }}
{{- if .useRoute }}
  service: |
    spec:
      type: ClusterIP
{{- end }}
{{- end }}
{{- end }}