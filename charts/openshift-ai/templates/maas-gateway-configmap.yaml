{{- if eq (include "openshift-ai.maasManaged" .) "true" }}
{{- with .Values.gateways.maasDefaultGateway }}
{{- $replicas := include "openshift-ai.replicas.validated" (dict "value" .replicas) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  {{- if or .resources (ne $replicas "") }}
  deployment: |
    spec:
      {{- if ne $replicas "" }}
      replicas: {{ $replicas }}
      {{- end }}
      {{- with .resources }}
      template:
        spec:
          containers:
          - name: istio-proxy
            resources:
              {{- toYaml . | nindent 16 }}
      {{- end }}
  {{- end }}
  {{- if .useRoute }}
  service: |
    spec:
      type: ClusterIP
  {{- end }}
{{- end }}
{{- end }}
