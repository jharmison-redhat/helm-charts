{{- with .Values.gateways.openshiftAiInference }}
{{- if and .create .useRoute }}
{{- $class := include "openshift-ai.gateway.className" (dict "gateway" .) }}
{{- $host := include "openshift-ai.gateway.hostname" (dict "root" $ "gateway" . "subdomain" "inference") }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
spec:
  host: {{ $host }}
  port:
    targetPort: 80
  tls:
    insecureEdgeTerminationPolicy: Allow
    termination: edge
  to:
    kind: Service
    name: {{ printf "openshift-ai-inference-%s" $class }}
    weight: 100
  wildcardPolicy: None
{{- end }}
{{- end }}
