{{- with .Values.evalhub }}
{{- if .create }}
{{- with .tenant }}
{{- if .create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-jobs-dspa-api
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-jobs-dspa-api
subjects:
- kind: ServiceAccount
  name: evalhub-redhat-ods-applications-job
  namespace: {{ .namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-jobs-pipeline-management
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ds-pipeline-dspa
subjects:
- kind: ServiceAccount
  name: evalhub-redhat-ods-applications-job
  namespace: {{ .namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
