# CI-only placeholder values: the chart's defaults carry no Ceph storage, which
# fails the full Ceph+MCGW render validation by design. chart_ci.py passes this
# file with -f during the default-values render check so the chart can render in
# CI. It exists ONLY for that purpose — real installs must supply the real
# storage configuration (storageDeviceSets, or disks with monDataDirHostPath, or
# a standalone MCGW configuration), which fail fast with mode-naming diagnostics
# when missing. Do not reference this file when installing the chart. The
# chart's .helmignore excludes this file from helm package, so it never ships in
# the published OCI artifact.
storageDeviceSets:
  - name: ocs-deviceset
    dataPVCTemplate:
      spec:
        storageClassName: placeholder-csi
        accessModes:
          - ReadWriteOnce
        volumeMode: Block
        resources:
          requests:
            storage: 1Ti
    replica: 3
