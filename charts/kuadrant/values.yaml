global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

# Namespace the restart Job's RBAC is bound in — must match the namespace the
# rhcl-operator Subscription was installed into (see the install-operators
# chart values; default matches the kuadrant-operator namespace used there).
operatorNamespace: kuadrant-system

kuadrant:
  create: true
  namespace: kuadrant-system
  spec:
    observability:
      enable: true

authorino:
  overwrite: true
  serviceTls: true
  spec:
    listener:
      tls:
        certSecretRef:
          name: authorino-server-cert
        enabled: true
