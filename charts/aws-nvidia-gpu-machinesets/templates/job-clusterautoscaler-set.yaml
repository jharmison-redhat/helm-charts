{{- if .Values.autoscaling.enabled -}}
{{- /* The platform ClusterAutoscaler/default singleton may pre-exist with
foreign configuration, so this chart's GPU autoscaling policy is applied to
it through this hook Job instead of a release-owned manifest; the Job runs
after the release is applied and is deleted and recreated on upgrade so the
immutable Job spec is never rejected */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  namespace: openshift-machine-api
  name: clusterautoscaler-set
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: clusterautoscaler
      restartPolicy: Never
      containers:
      - name: clusterautoscaler-set
        image: {{ .Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command: ["/mnt/clusterautoscaler-set.sh"]
        securityContext:
          {{- include "common.hook-security-context" . | nindent 10 }}
        volumeMounts:
        - name: clusterautoscaler-config
          mountPath: /mnt
      volumes:
      - name: clusterautoscaler-config
        configMap:
          name: clusterautoscaler-config
          defaultMode: 493
{{- end }}
