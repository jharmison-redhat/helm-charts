global:
  # Image for the ClusterAutoscaler hook Job containers; the chart-local
  # registry name keeps installs working on disconnected clusters that mirror
  # openshift/tools
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

# https://aws.amazon.com/ec2/instance-types/#Accelerated_Computing
instanceType: g6e.2xlarge
desiredReplicas: 1
baseName: gpu-worker
rootDeviceSizeGB: 200
# When enabled, one MachineAutoscaler per availability zone (per-zone
# minReplicas/maxReplicas distribute the totals exactly) and a
# ClusterAutoscaler/default configured by hook Jobs — the singleton is never
# a release manifest, and fields the chart does not manage are never touched
autoscaling:
  enabled: false
  minReplicas: 0
  # MUST be at least the number of entries in aws.azs when enabled: the
  # MachineAutoscaler CRD enforces maxReplicas >= 1 per zone, and the render
  # fails below that minimum
  maxReplicas: 1
  # Passthrough to the hook-configured ClusterAutoscaler's spec.scaleDown;
  # omitted from the object entirely when empty
  scaleDown:
    enabled: true
    delayAfterAdd: 30m
    delayAfterDelete: 5m
    delayAfterFailure: 30s
    unneededTime: 15m
    utilizationThreshold: "0.7"

taints:
  - key: nvidia.com/gpu
    value: ""
    effect: NoSchedule

nodeLabels:
  node-role.kubernetes.io/gpu: ""

# REQUIRED — the chart fails to render until this is set. The infraID constructs
# the MachineSet names and the AWS resource names the MachineSets depend on: the
# kubernetes.io/cluster/<infraID>: owned tag, the <infraID>-worker-profile IAM
# instance profile, the <infraID>-node and <infraID>-lb security groups, and the
# <infraID>-subnet-private-<az> subnets. Find it in the names of the existing
# worker MachineSets in openshift-machine-api.
cluster:
  infraID: ""

aws:
  # REQUIRED — the region the cluster runs in (MachineSet placement).
  region: ""
  # Which availability zone carries the desired replicas; defaults to the last
  # entry of azs. The other zones render with replicas: 0 (when autoscaling is
  # disabled).
  az: null
  # REQUIRED — a non-empty list of availability zones; one MachineSet is
  # rendered per entry.
  azs: []
  # REQUIRED — the RHCOS worker AMI ID for the cluster's region. Copy it from an
  # existing worker MachineSet's providerSpec (see the README).
  ami: ""
