{{- include "cert-manager.validateCa" . }}
{{- include "cert-manager.validateAcme" . -}}
{{- range $name, $acme := .Values.acme }}
{{- /* The comment action must not right-trim: the newline it would eat is the
one separating the previous iteration's last line from this `---` document
separator (a right-trim glues them into one YAML document). */}}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    email: {{ $acme.email }}
    {{- with $acme.preferredChain }}
    preferredChain: {{ toYaml . }}
    {{- end }}
    {{- with $acme.disableAccountKeyGeneration }}
    disableAccountKeyGeneration: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: acme-{{ $name }}-privatekey
    server: {{ $acme.server }}
    {{- with $acme.externalAccountBinding }}
    externalAccountBinding:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    solvers:
    {{- range $solver := $acme.solvers -}}
      {{- if eq $solver.type "dns" }}
      - dns01:
          {{- toYaml $solver.dnsConfig | nindent 10 }}
        {{- with $solver.dnsZones }}
        selector:
          dnsZones:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- else if eq $solver.type "http" }}
      - http01:
          ingress:
            ingressClassName: {{ $solver.ingressClassName }}
      {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.ca.enabled }}
{{- if and .Values.ca.tlsCrt .Values.ca.tlsKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-ca
  namespace: cert-manager
stringData:
  tls.crt: |-
    {{- .Values.ca.tlsCrt | nindent 4 }}
  tls.key: |-
    {{- .Values.ca.tlsKey | nindent 4 }}
{{- else }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: selfsigned-ca
  # Explicit 10-year lifetime: without it cert-manager applies its 90-day
  # default, and an expiring self-signed root hard-fails verification in Go
  # clients
  duration: {{ .Values.ca.duration | default "87600h" }}
  secretName: cert-manager-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    # Explicit: the upstream default became `Always` in cert-manager 1.18, and
    # key rotation at renewal would break chains anchored on the bundle's
    # original entry; renewal reuses this key instead
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: cert-manager-ca
{{- end }}
