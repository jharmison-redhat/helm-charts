{{- /* The cert-manager Operator for Red Hat OpenShift auto-creates the
CertManager cluster-scoped configuration singleton at CSV install — before
any release exists — so it is never a release manifest: this surface's hook
Job converges its managed spec field by value instead. The grants are
resourceName-scoped to exactly the operator's singleton and the CRD it waits
on; there is no create or delete verb, because the hook never creates or
deletes the operator-owned object */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: converge-cert-manager
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: converge-cert-manager
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - certmanagers.operator.openshift.io
  verbs:
  - get
- apiGroups:
  - operator.openshift.io
  resources:
  - certmanagers
  resourceNames:
  - cluster
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: converge-cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: converge-cert-manager
subjects:
- kind: ServiceAccount
  name: converge-cert-manager
  namespace: cert-manager
