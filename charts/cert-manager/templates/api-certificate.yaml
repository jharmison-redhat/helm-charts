{{- if .Values.certificates.api.managed -}}
{{- include "cert-manager.validateCertificateIssuer" . -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshift-api
  namespace: openshift-config
spec:
  dnsNames:
    {{- if .Values.certificates.api.dnsNames }}
    {{- toYaml .Values.certificates.api.dnsNames | nindent 4 }}
    {{- else }}
    - api.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}
    {{- end }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.certificates.clusterIssuer }}
  secretName: openshift-api
{{- end }}
