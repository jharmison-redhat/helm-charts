---
global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
  cluster:
    # REQUIRED: set to your cluster name before enabling managed certificates —
    # the placeholder is baked into the rendered DNS names otherwise
    name: cluster
    # REQUIRED: set to your cluster base domain before enabling managed certificates
    baseDomain: domain.com

operatorConfig:
  # Seconds the converge hook waits for the operator-created CertManager
  # cluster singleton (and its CRD) to exist before failing; the Job's
  # activeDeadlineSeconds covers this plus headroom
  waitTimeoutSeconds: 120

ca:
  enabled: true
  # Go duration of the self-provisioned CA certificate (the selfsigned-ca
  # Certificate). The root is a stable, manually-managed anchor: renewal at
  # ~2/3 of the lifetime reuses the private key (rotationPolicy is pinned to
  # Never), and re-issuance is asynchronous — the trust bundle converges on
  # the next hook run, not necessarily within the same upgrade. Ignored on
  # the bring-your-own path, which trusts the given keypair as-is
  duration: 87600h
  # Seconds the trust-ca-set Job waits for the `cert-manager-ca` Secret to
  # exist before failing; the Job's activeDeadlineSeconds covers this plus
  # headroom
  trustTimeoutSeconds: 120
  trust:
    # Renders the whole cluster-trust surface (the trust-ca ServiceAccount
    # and RBAC, the trust-ca-config ConfigMap, and the set/remove hook Jobs)
    # only when this AND `ca.enabled` are true; ca-issuer issuance is
    # unaffected. Flipping this off after an install stops rendering the
    # pre-delete cleanup hook, so the Proxy reference and the bundle entry
    # persist until removed manually or the chart is uninstalled with trust
    # re-enabled (see the README's cluster-trust section)
    enabled: true
  # Bring-your-own CA: set both to skip self-provisioning and trust the given
  # keypair as `cert-manager-ca` instead; rendering fails when either is set
  # while `ca.enabled` is false, or when only one of the two is set
  # tlsCrt: <PEM certificate>
  # tlsKey: <PEM key>

acme: {}

# Stock OpenShift clusters keep their platform-issued certificates unless a
# service opts in; `managed` defaults to false so installing this chart does
# not replace platform certs.
certificates:
  # ClusterIssuer used for managed certificates; rendering fails unless it
  # names a rendered ClusterIssuer — a key of `acme`, or `ca-issuer` when
  # `ca.enabled`
  clusterIssuer: zerossl
  # clusterIssuer: letsencrypt
  # When managed, the Certificate renders as a release-owned resource and a
  # post-install/post-upgrade hook Job writes the platform reference
  # (IngressController/default.defaultCertificate) with a
  # resourceVersion-conditional merge patch; a reference to a foreign
  # certificate stops the hook instead of overwriting
  router:
    managed: false
  # Same hook pattern for the APIServer cluster object's
  # servingCerts.namedCertificates list
  api:
    managed: false
  # Renders a Certificate only — the external LB references it; no platform
  # object is patched
  nlbRouter:
    managed: false
