---
global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
  cluster:
    # REQUIRED: set to your cluster name before enabling managed certificates —
    # the placeholder is baked into the rendered DNS names otherwise
    name: cluster
    # REQUIRED: set to your cluster base domain before enabling managed certificates
    baseDomain: domain.com

ca:
  enabled: true
  # Seconds the trust-ca Job waits for the `cert-manager-ca` Secret to exist
  # before failing; the Job's activeDeadlineSeconds covers this plus headroom
  trustTimeoutSeconds: 120
  # Bring-your-own CA: set both to skip self-provisioning and trust the given
  # keypair as `cert-manager-ca` instead
  # tlsCrt: <PEM certificate>
  # tlsKey: <PEM key>

acme: {}
# One ClusterIssuer renders per key. Each entry requires `server` and
# `email`; every solver requires `type: dns` (with `dnsConfig`) or
# `type: http` (with `ingressClassName`) — rendering fails otherwise.
# The EAB HMAC key must be un-padded base64url.
# zerossl:
#   server: https://acme.zerossl.com/v2/DV90
#   email: <put your email here>
#   externalAccountBinding:
#     keyID: <put your ZeroSSL EAB key here>
#     keySecretRef:
#       name: acme-zerossl-eabsecret
#       key: secret
#   solvers:
#     - type: dns
#       dnsConfig:
#         route53:
#           accessKeyID: <put your AWS Access Key ID here>
#           hostedZoneID: <put your Hosted Zone ID here>
#           region: us-east-2
#           secretAccessKeySecretRef:
#             key: secret-access-key
#             name: acme-zerossl-route53-creds
#       dnsZones:
#         - <put your baseDomain here>
#   secrets:
#     - name: route53-creds
#       stringData:
#         secret-access-key: <put your actual key here>
#     - name: eabsecret
#       stringData:
#         secret: <put your actual HMAC key here>
# letsencrypt:
#   server: https://acme-v02.api.letsencrypt.org/directory
#   email: <your email address here>
#   solvers:
#     - type: dns
#       dnsConfig:
#         route53:
#           accessKeyID: <put your AWS Access Key ID here>
#           hostedZoneID: <put your Hosted Zone ID here>
#           region: us-west-2
#           secretAccessKeySecretRef:
#             key: secret-access-key
#             name: acme-letsencrypt-route53-creds
#       dnsZones:
#         - <put your baseDomain here>
#   secrets:
#     - name: route53-creds
#       stringData:
#         secret-access-key: <put your actual key here>
# To pre-provision the ACME account key instead of letting cert-manager
# generate one, add these keys to the `letsencrypt` block above — a second
# `letsencrypt:` key here would fail YAML validation. Set
# disableAccountKeyGeneration: true only with the pre-provisioned account
# key in the referenced Secret (the chart renders it as
# acme-<name>-privatekey, expecting the key under `tls.key`), provided via
# a secrets entry named `privatekey` with a `tls.key` data key:
# letsencrypt:
#   disableAccountKeyGeneration: true
#   secrets:
#     - name: privatekey
#       data:
#         tls.key: <base64-encoded PEM account key>

# Stock OpenShift clusters keep their platform-issued certificates unless a
# service opts in; `managed` defaults to false so installing this chart does
# not replace platform certs.
certificates:
  # ClusterIssuer used for managed certificates; rendering fails unless it
  # names a rendered ClusterIssuer — a key of `acme`, or `ca-issuer` when
  # `ca.enabled`
  clusterIssuer: zerossl
  # clusterIssuer: letsencrypt
  # When managed, the Certificate renders as a release-owned resource and a
  # post-install/post-upgrade hook Job writes the platform reference
  # (IngressController/default.defaultCertificate) with a
  # resourceVersion-conditional merge patch; a reference to a foreign
  # certificate stops the hook instead of overwriting
  router:
    managed: false
  # Same hook pattern for the APIServer cluster object's
  # servingCerts.namedCertificates list
  api:
    managed: false
  # Renders a Certificate only — the external LB references it; no platform
  # object is patched
  nlbRouter:
    managed: false
