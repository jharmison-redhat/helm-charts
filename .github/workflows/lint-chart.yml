name: Lint & Render Helm Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - .github/workflows/chart_ci.sh
      - .github/workflows/lint-chart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: discover
        run: |
          set -euo pipefail
          dirs=$(find charts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "chart=${dirs}" >> "$GITHUB_OUTPUT"
    outputs:
      chart: ${{ steps.discover.outputs.chart }}

  lint-charts:
    needs: charts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.charts.outputs.chart) }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: lint
        run: .github/workflows/chart_ci.sh lint-local "charts/${{ matrix.chart }}"

  umbrella:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: lint
        run: .github/workflows/chart_ci.sh lint-local examples/maas-umbrella
