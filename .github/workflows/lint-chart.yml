name: Lint & Render Helm Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - .github/workflows/chart_ci.py
      - .github/workflows/chart_versions.py
      - .github/workflows/chart_metadata.py
      - .github/workflows/requirements.txt
      - .github/workflows/test_chart_helpers.py
      - tests/charts/**
      - .github/workflows/lint-chart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: discover
        run: |
          set -euo pipefail
          dirs=$(find charts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "chart=${dirs}" >> "$GITHUB_OUTPUT"
    outputs:
      chart: ${{ steps.discover.outputs.chart }}

  lint-charts:
    needs: charts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.charts.outputs.chart) }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt
      - id: install-dependencies
        run: python -m pip install -r .github/workflows/requirements.txt
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: lint
        run: python .github/workflows/chart_ci.py lint-local "charts/${{ matrix.chart }}"

  umbrella:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt
      - id: install-dependencies
        run: python -m pip install -r .github/workflows/requirements.txt
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: lint
        run: python .github/workflows/chart_ci.py lint-local examples/maas-umbrella

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt
      - id: install-dependencies
        run: python -m pip install -r .github/workflows/requirements.txt
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: test-helpers
        run: python -m unittest discover -s .github/workflows -p 'test_*.py'
      - id: test-charts
        run: python -m unittest discover -s tests/charts -p 'test_*.py'
