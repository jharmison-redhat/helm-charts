name: Lint & Render Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "examples/**"
      - .github/workflows/lint-chart.yml
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - .github/workflows/lint-chart.yml

permissions: {}

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: discover
        run: |
          set -euo pipefail
          dirs=$(find charts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "chart=${dirs}" >> "$GITHUB_OUTPUT"
    outputs:
      chart: ${{ steps.discover.outputs.chart }}

  lint-charts:
    needs: charts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.charts.outputs.chart) }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-helm
        uses: azure/setup-helm@v4
      - id: deps
        run: |
          set -euo pipefail
          if grep -q '^dependencies:' "charts/${{ matrix.chart }}/Chart.yaml"; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
            helm dependency build "charts/${{ matrix.chart }}"
          fi
      - id: lint
        run: |
          set -euo pipefail
          helm lint "charts/${{ matrix.chart }}"
      - id: render
        run: |
          set -euo pipefail
          helm template "charts/${{ matrix.chart }}" > /dev/null

  umbrella:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-helm
        uses: azure/setup-helm@v4
      - id: log-in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - id: deps
        run: |
          set -euo pipefail
          helm dependency build examples/maas-umbrella
      - id: lint
        run: |
          set -euo pipefail
          helm lint examples/maas-umbrella
      - id: render
        run: |
          set -euo pipefail
          helm template examples/maas-umbrella > /dev/null
