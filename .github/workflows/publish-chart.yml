name: Build & Publish Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - .github/workflows/publish-chart.yml
  workflow_dispatch:

permissions: {}

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          fetch-tags: true
      - id: versions
        run: .github/workflows/chart_versions.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}
    outputs:
      publish: ${{ steps.versions.outputs.publish }}
      matrix: ${{ steps.versions.outputs.matrix }}

  publish:
    runs-on: ubuntu-latest
    needs: versions
    if: ${{ needs.versions.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-helm
        uses: azure/setup-helm@v4
      - id: log-in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - id: package-and-push
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          newpath="${workdir}/${{ matrix.name }}"

          cp -a '${{ matrix.path }}' "${newpath}"

          # A dependency chart may publish in a parallel matrix job in the
          # same run, so the build can transiently 404 — retry to let the
          # sibling publish land.
          if grep -q '^dependencies:' "${newpath}/Chart.yaml"; then
            attempts=0
            until helm dependency build "${newpath}"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 3 ]; then
                echo "::error::helm dependency build for ${{ matrix.name }} failed after 3 attempts"
                exit 1
              fi
              echo "::warning::helm dependency build failed (attempt ${attempts}); retrying in 30s"
              sleep 30
            done
          fi

          helm package "${newpath}"
          helm push "${{ matrix.name }}-${{ matrix.version }}.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/helm-charts'
