name: Build & Publish Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - .github/workflows/chart_ci.py
      - .github/workflows/chart_versions.py
      - .github/workflows/chart_metadata.py
      - .github/workflows/requirements.txt
      - .github/workflows/publish-chart.yml
  workflow_dispatch:

concurrency:
  group: publish-charts
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt
      - id: install-dependencies
        run: python -m pip install -r .github/workflows/requirements.txt
      - id: versions
        run: python .github/workflows/chart_versions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
    outputs:
      publish: ${{ steps.versions.outputs.publish }}
      matrix: ${{ steps.versions.outputs.matrix }}

  publish:
    runs-on: ubuntu-latest
    needs: versions
    if: ${{ needs.versions.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt
      - id: install-dependencies
        run: python -m pip install -r .github/workflows/requirements.txt
      - id: setup-helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - id: log-in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - id: package-and-push
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          newpath="${workdir}/${{ matrix.name }}"

          cp -a '${{ matrix.path }}' "${newpath}"

          python .github/workflows/chart_ci.py build-registry "${newpath}"
          python .github/workflows/chart_ci.py lint "${newpath}"

          helm package "${newpath}"
          helm push "${{ matrix.name }}-${{ matrix.version }}.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/helm-charts'
